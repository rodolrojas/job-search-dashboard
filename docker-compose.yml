name: job-dashboard

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-role_radar}
            POSTGRES_USER: ${POSTGRES_USER:-role_radar}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-role_radar_dev}
        ports:
            - "5500:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-role-radar-schema.sql:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - job-search-network
    frontend:
        build:
            context: .
        ports:
            - "3000:3000"
        depends_on:
            - backend
        networks:
            - job-search-network
    backend:
        build:
            context: ./backend
        command: flask run --debug --host=0.0.0.0 --port=5000
        restart: unless-stopped
        env_file:
            - ./backend/.env
        ports:
            - "5000:5000"
        environment:
            DATA_ROOT: /data/job-search-dashboard/backend
            DB_HOST: postgres
            DB_PORT: 5432
            POSTGRES_DB: ${POSTGRES_DB:-role_radar}
            POSTGRES_USER: ${POSTGRES_USER:-role_radar}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-role_radar_dev}
        volumes:
            - ./backend:/app
            - ../:/data
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - job-search-network
networks:
    job-search-network:
        driver: bridge
volumes:
    postgres-data:
